name: website_flutter
description: A new Flutter project with Serverpod.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.11.0'
  flutter: '>=3.0.0'

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.5
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  website_client:
    path: ../website_client
  serverpod_flutter: 4.1.0-beta.3
  serverpod_auth_idp_flutter: 4.1.0-beta.3

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
