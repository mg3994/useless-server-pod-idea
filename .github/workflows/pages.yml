name: Deploy Webpage to GitHub Pages

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'webpage/package-lock.json'

      - name: Setup Flutter (Beta Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'

      - name: Export Dart SDK to PATH
        run: |
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_ROOT/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: |
          cd website_client && dart pub get
          cd ../webpage && dart pub get
          npm install

      - name: Build UnoCSS Styles
        run: |
          cd webpage
          npm run build

      - name: Verify Client Script Compilation
        run: |
          cd webpage
          dart compile js lib/scripts/script.dart -o /tmp/script_test.js

      - name: Generate Webpage Static HTML
        run: |
          cd webpage
          dart bin/main.dart

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'webpage/build'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
