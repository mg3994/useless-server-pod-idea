name: Deploy Webpage to GitHub Pages

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'webpage/package-lock.json'

      - name: Setup Flutter (Beta Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'

      - name: Install Node Dependencies & Build UnoCSS
        run: |
          cd webpage
          npm install
          npm run build

      - name: Install Dart Dependencies & Generate Webpage HTML
        run: |
          cd webpage
          dart pub get
          dart bin/main.dart

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'webpage/build'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
